name: lenden
description: LenDen - check your loan chances, compare offers, apply and repay; review panels for lenders.
publish_to: "none"
version: 3.0.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  http: ^1.2.2
  http_parser: ^4.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  file_picker: ^8.1.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
